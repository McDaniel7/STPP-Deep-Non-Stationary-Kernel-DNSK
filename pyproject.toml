[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dnsk"
version = "0.1.0"
description = "Spatio-temporal point processes with deep non-stationary kernels (ICLR 2023)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Zheng Dong" },
    { name = "Xiuyuan Cheng" },
    { name = "Yao Xie" },
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "torch>=2.0"]
keywords = ["point process", "Hawkes process", "spatio-temporal", "deep kernel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/McDaniel7/STPP-Deep-Non-Stationary-Kernel-DNSK"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "E741"]  # E741: l, r follow the paper notation
